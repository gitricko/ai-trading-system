<h2>01 assets</h2>
<p class="sub">How each asset moves, training window 2022-01-03 to 2024-12-31 &middot; labels: keeps going / snaps back / holds up. Hover any cell for its value.</p>

<div class="main">
  <div id="asset-table" style="overflow-x:auto"></div>
  <h3 style="margin:26px 0 4px;font-size:1.05rem;color:var(--teal)">Correlation of daily returns</h3>
  <div id="corr-chart" style="margin:0 auto"></div>
</div>

<script>
(function () {
  var DATA = {{ASSET_STUDY}};
  var GROUPS = {{ASSET_GROUPS}};
  var byTicker = {};
  DATA.rows.forEach(function (r) { byTicker[r.ticker] = r; });
  function pct(x) { return x == null || x === "" ? "–" : (100 * x).toFixed(1) + "%"; }
  function num(x, d) { return x == null || x === "" ? "–" : Number(x).toFixed(d); }
  function tag(txt, on) {
    var c = on ? "var(--teal)" : "rgba(17,17,17,0.30)";
    return '<span style="display:inline-block;margin:0 4px 2px 0;padding:1px 8px;border:1px solid '
      + c + ';border-radius:10px;font-size:.72rem;color:' + c + ';white-space:nowrap">' + txt + '</span>';
  }
  var order = Object.keys(GROUPS);
  var HEADS = [
    "Asset", "Labels",
    ["Ret/yr", "annualized return over the training window"],
    ["Vol", "annualized volatility (std-dev of daily returns)"],
    ["Max DD", "max drawdown, biggest peak-to-trough fall"],
    ["Up days", "share of days the close is above its 200-day line"],
    ["Trend gap", "annualized return on uptrend days minus annualized return on downtrend days"],
    ["Mkt down", "annualized return on the market (SPY) downtrend days"],
    ["Corr", "daily-return correlation with SPY"],
    ["Calm\u2192wild", "average daily move size on calm days, and on wild days"],
    ["KG exc/n", "KEEPS GOING: excess 20-day return vs all 20-day windows / event count (needs \u22656, +20 pts)"],
    ["SB exc/n", "SNAPS BACK: excess 5-day return vs all 5-day windows / event count (needs \u226512, +5 pts)"],
    ["SB\u2032 exc/n", "SNAPS BACK measured below the 200-day line instead of above it; same 5-day test / events"],
    ["Holds", "HOLDS UP: beats SGOV cash on market down days AND correlation with SPY below 0.5"],
    "Line"
  ];
  var html = '<table class="settings asset-table"><thead><tr>';
  HEADS.forEach(function (h) {
    var label = Array.isArray(h) ? h[0] : h, tip = Array.isArray(h) ? h[1] : null;
    html += tip ? '<th data-tip="' + tip.replace(/"/g,"&quot;") + '">' + label + '</th>'
                : '<th>' + label + '</th>';
  });
  html += '</tr></thead><tbody>';
  order.forEach(function (g) {
    html += '<tr><td colspan="15" class="grp">' + g + '</td></tr>';
    GROUPS[g].forEach(function (t) {
      var r = byTicker[t]; if (!r) return;
      html += '<tr>'
        + '<td><strong class="accent-teal">' + t + '</strong></td>'
        + '<td style="white-space:normal;min-width:150px">' + tag("keeps going", r.keeps_going) + tag("snaps back", r.snaps_back) + tag("holds up", r.holds_up) + '</td>'
        + '<td>' + pct(r.ann_return) + '</td>'
        + '<td>' + pct(r.volatility) + '</td>'
        + '<td>' + pct(r.max_drawdown) + '</td>'
        + '<td>' + pct(r.share_uptrend_days) + '</td>'
        + '<td>' + num(r.trend_gap, 3) + '</td>'
        + '<td>' + pct(r.ann_return_when_market_falls) + '</td>'
        + '<td>' + num(r.corr_with_market, 2) + '</td>'
        + '<td>' + num(r.avg_abs_move_calm_days, 3) + ' &#8594; ' + num(r.avg_abs_move_wild_days, 3) + '</td>'
        + '<td>' + num(r.keeps_going_excess, 3) + ' / ' + r.keeps_going_events + '</td>'
        + '<td>' + num(r.snaps_back_excess, 3) + ' / ' + r.snaps_back_events + '</td>'
        + '<td>' + num(r.snaps_back_below_line_excess, 3) + ' / ' + r.snaps_back_below_line_events + '</td>'
        + '<td>' + (r.holds_up ? '<span class="accent-teal">yes</span>' : '<span style="opacity:.4">no</span>') + '</td>'
        + '<td><span class="line-ico" data-tip="' + r.plain.replace(/"/g, "&quot;").replace(/</g,"&lt;") + '">i</span></td>'
        + '</tr>';
    });
  });
  html += '</tbody></table>';

  // keep tooltips on screen: pop upward for anything near the bottom of the page
  Array.prototype.forEach.call(document.querySelectorAll('[data-tip]'), function (el) {
    if (el.getBoundingClientRect().bottom > window.innerHeight - 90) el.classList.add('tip-above');
  });
  html += '<p style="margin:6px 0 0;font-size:.75rem;color:rgba(17,17,17,.5)" class="legend">';
  html += 'KG = keeps going, SB = snaps back, SB&rsquo; = snaps back below the line, exc = excess return vs all windows, n = events, Mkt down = return on market&rsquo;s downtrend days, Up days = share of days above the 200-day line</p>';
  document.getElementById("asset-table").innerHTML = html;

  // ---- correlation heat map (proper 2D matrix) ----
  var tickers = DATA.rows.map(function (r) { return r.ticker; });
  var C = DATA.correlations;
  var n = tickers.length;
  var z = [], text = [];
  for (var i = 0; i < n; i++) {
    z.push([]); text.push([]);
    for (var j = 0; j < n; j++) {
      var v = C[tickers[i]][tickers[j]];
      z[i].push(v);
      text[i].push(tickers[i] + " vs " + tickers[j] + ": <b>" + v.toFixed(2) + "</b>");
    }
  }
  var trace = {
    type: "heatmap", x: tickers, y: tickers, z: z,
    text: text, texttemplate: "", textposition: "outside",
    hovertemplate: "%{y} vs %{x}: <b>%{z:.3f}</b><extra></extra>",
    colorscale: [[0, "#8a5a10"], [0.5, "#eef4f7"], [1, "#0f766e"]],
    zmin: -1, zmax: 1,
    xgap: 2, ygap: 2,
    colorbar: { thickness: 14, len: 0.85, title: { text: "corr", side: "right", font: { size: 13 } } }
  };
  var layout = {
    margin: { l: 90, r: 70, t: 10, b: 90 },
    width: 820, height: 820,
    xaxis: { tickangle: -45, font: { size: 11 }, gridcolor: "rgba(15,118,110,0.15)" },
    yaxis: { autorange: "reversed", font: { size: 11 }, gridcolor: "rgba(15,118,110,0.15)" }
  };
  Plotly.newPlot("corr-chart", [trace], layout, { responsive: true, displayModeBar: false });
})();
</script>
