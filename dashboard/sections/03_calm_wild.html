<h2>Calm vs wild</h2>
<p class="sub" id="cw-sub">Loading&hellip;</p>

<div id="cw-chart" class="cw-wrap"></div>
<div class="cw-legend">
  <span class="li"><i class="sw calm"></i>calm days</span>
  <span class="li"><i class="sw wild"></i>wild days</span>
  <span class="sep">indices&nbsp;&middot;&nbsp;bonds&nbsp;&middot;&nbsp;metals</span>
</div>

<script>
(function () {
  var D = {{CALM_WILD}};
  var tw = D.training_window;
  document.getElementById("cw-sub").innerHTML =
    "Average size of a daily move (close to close) on <b>calm</b> days vs <b>wild</b> days &middot; training window "
    + tw[0] + " \u2192 " + tw[1]
    + ". A <b>wild</b> day is one whose 20-day volatility is above its own median over the previous 252 days. "
    + "Hover a bar for the exact number and how many days it covers.";

  // same order as the Assets table, limited to the three groups in scope
  var order = ["SPY", "QQQ", "IWM", "DIA", "TLT", "IEF", "SHY", "GLD", "SLV"];
  var rows = D.rows.filter(function (r) { return order.indexOf(r.ticker) !== -1; });
  rows.sort(function (a, b) { return order.indexOf(a.ticker) - order.indexOf(b.ticker); });

  var cats = [], calmY = [], wildY = [], calmN = [], wildN = [];
  rows.forEach(function (r) {
    cats.push(r.ticker);
    calmY.push(r.calm_pct); wildY.push(r.wild_pct);
    calmN.push(r.n_calm); wildN.push(r.n_wild);
  });
  var top = Math.max.apply(null, wildY.concat(calmY)) * 1.12;

  var traces = [
    {
      type: "bar", name: "calm days", x: cats, y: calmY,
      marker: { color: "rgba(15,118,110,0.8)" },
      hoverinfo: "text",
      text: cats.map(function (t, i) {
        return t + " &middot; calm days<br>avg |move|: <b>" + rows[i].calm_pct
          + "%</b><br>" + rows[i].n_calm + " days";
      }),
      customdata: calmN
    },
    {
      type: "bar", name: "wild days", x: cats, y: wildY,
      marker: { color: "rgba(161,98,7,0.8)" },
      hoverinfo: "text",
      text: cats.map(function (t, i) {
        return t + " &middot; wild days<br>avg |move|: <b>" + rows[i].wild_pct
          + "%</b><br>" + rows[i].n_wild + " days";
      }),
      customdata: wildN
    },
    // dotted vertical dividers: after index 3 (indices|bonds) and index 6 (bonds|metals)
    { type: "scatter", mode: "lines", x: [3.5, 3.5], y: [0, top / 1.10],
      line: { color: "rgba(30,58,95,0.30)", width: 1, dash: "dot" }, hoverinfo: "skip" },
    { type: "scatter", mode: "lines", x: [6.5, 6.5], y: [0, top / 1.10],
      line: { color: "rgba(30,58,95,0.30)", width: 1, dash: "dot" }, hoverinfo: "skip" }
  ];

  var layout = {
    margin: { l: 58, r: 18, t: 28, b: 58 },
    height: 420,
    barmode: "group",
    showlegend: false,
    font: { family: "Segoe UI, Helvetica, Arial, sans-serif", size: 13 },
    yaxis: {
      title: { text: "avg |move| per day (%)", font: { size: 12 } },
      zeroline: true, zerolinecolor: "rgba(17,17,17,0.25)",
      range: [0, top]
    },
    xaxis: { showgrid: false, tickangle: 0, font: { size: 13 } }
  };
  Plotly.newPlot("cw-chart", traces, layout, { responsive: true, displayModeBar: false });
})();
</script>
